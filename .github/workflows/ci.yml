# PR gate: install, build, post-build checks, dependency audit.
# Runs on pull requests only. Production deploys happen via Workers Builds on push to main; this workflow never deploys.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high
